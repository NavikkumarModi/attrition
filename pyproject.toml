[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attrition"
version = "0.2.0"
description = "ATTRITION: Agent Testbed for Task, Resource and Irreversible-Tradeoff Investigation -- bandits with consumable action sets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Navikkumar Modi", email = "navikkumarmodi@gmail.com"}]
keywords = ["bandits", "reinforcement-learning", "externalities", "irreversibility",
            "agent-safety", "multi-agent", "consumable-resources"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=7"]
figures = ["matplotlib>=3.5"]
cli = ["pyyaml>=6"]
analysis = ["pandas>=1.3"]
llm = ["anthropic>=0.40"]

[project.scripts]
attrition = "attrition.cli:main"

[project.urls]
Homepage = "https://github.com/<user>/attrition"
Repository = "https://github.com/<user>/attrition"
Paper = "https://github.com/<user>/attrition/tree/main/paper"

[tool.setuptools.packages.find]
include = ["attrition*", "experiments*"]

[tool.setuptools.package-data]
attrition = ["data/*.json"]
