name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: One regression test per theorem
        run: |
          pytest tests/ -v
      - name: All experiments import cleanly
        run: |
          for f in experiments/exp*.py; do
            python -c "import importlib,sys; importlib.import_module('experiments.'+sys.argv[1])" \
              "$(basename "$f" .py)" || exit 1
          done
